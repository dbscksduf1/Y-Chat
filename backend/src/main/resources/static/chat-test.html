<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Chat Test</title>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>

<h2>채팅 테스트</h2>

이메일: <input type="text" id="email"><br>
비밀번호: <input type="password" id="password"><br>
Room ID: <input type="text" id="roomId"><br>
메시지: <input type="text" id="message"><br><br>

<button onclick="login()">로그인</button>
<button onclick="connect()">WebSocket 연결</button>
<button onclick="sendMessage()">메시지 보내기</button>

<hr>
<h3>채팅</h3>
<div id="messages"></div>

<hr>
<h3>Unread 이벤트</h3>
<div id="unread"></div>

<script>

    let stompClient = null;
    let token = null;
    let currentEmail = null;
    let roomSubscription = null; // 🔥 현재 방 구독 저장용

    function login() {

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        })
        .then(res => res.text())
        .then(data => {
            token = data.trim();
            currentEmail = email;
            alert("로그인 성공");
        });
    }

    function connect() {

        if (!token) {
            alert("먼저 로그인하세요");
            return;
        }

        const roomId = document.getElementById("roomId").value;

        // 🔥 메시지 영역 초기화
        document.getElementById("messages").innerHTML = "";

        // 🔥 과거 메시지 불러오기
        fetch("/api/chat/rooms/" + roomId + "/messages", {
            headers: {
                "Authorization": "Bearer " + token
            }
        })
        .then(res => res.json())
        .then(data => {

            data.forEach(msg => {

                const msgDiv = document.createElement("div");
                msgDiv.id = "msg-" + msg.id;
                msgDiv.innerText = msg.sender + " : " + msg.content;

                if (msg.sender === currentEmail) {
                    const badge = document.createElement("span");
                    badge.innerText = " 1";
                    badge.style.color = "red";
                    badge.id = "badge-" + msg.id;
                    msgDiv.appendChild(badge);
                }

                document.getElementById("messages").appendChild(msgDiv);
            });
        });

        const socket = new SockJS("/ws-chat?token=" + token);
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function(frame) {

            alert("연결 성공");

            // 🔥 방 입장 이벤트
            stompClient.send("/app/chat.enter", {}, JSON.stringify({
                roomId: Number(roomId)
            }));

            // 🔥 이전 방 구독 해제
            if (roomSubscription) {
                roomSubscription.unsubscribe();
            }

            // 🔥 새 방 구독
            roomSubscription = stompClient.subscribe(
                "/topic/room/" + roomId,
                function(message) {

                    const data = JSON.parse(message.body);

                    const msgDiv = document.createElement("div");
                    msgDiv.id = "msg-" + data.id;
                    msgDiv.innerText = data.sender + " : " + data.content;

                    if (data.sender === currentEmail) {
                        const badge = document.createElement("span");
                        badge.innerText = " 1";
                        badge.style.color = "red";
                        badge.id = "badge-" + data.id;
                        msgDiv.appendChild(badge);
                    }

                    document.getElementById("messages").appendChild(msgDiv);
                }
            );

            // 🔥 unread 이벤트
            stompClient.subscribe("/user/queue/unread", function(message) {

                const data = JSON.parse(message.body);

                const msg = document.createElement("div");
                msg.innerText = "Unread 업데이트 방번호: " + data.roomId;

                document.getElementById("unread").appendChild(msg);
            });

            // 🔥 read 이벤트 → 1 제거
            stompClient.subscribe("/user/queue/read", function(message) {

                const data = JSON.parse(message.body);

                const badge = document.getElementById("badge-" + data.messageId);

                if (badge) {
                    badge.remove();
                }
            });

        });
    }

    function sendMessage() {

        if (!stompClient) {
            alert("먼저 연결하세요");
            return;
        }

        const roomId = document.getElementById("roomId").value;
        const message = document.getElementById("message").value;

        stompClient.send("/app/chat.send", {}, JSON.stringify({
            roomId: Number(roomId),
            message: message
        }));

        document.getElementById("message").value = "";
    }

</script>

</body>
</html>
